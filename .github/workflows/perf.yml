name: Performance

# Benchmarks every pull request against its base branch on the same runner
# and reports the difference as a PR comment and in the job summary. The
# report is informational only: it never fails the check.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CRYSTAL_VERSION: "1.19.1"
  ROUNDS: "6"

jobs:
  compare:
    name: Compare with base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4
        with:
          path: head
      - name: Check out the base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Install valgrind (instruction counts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Build the PR benchmarks
        run: crystal build --release head/bench/perf.cr -o "$RUNNER_TEMP/perf-head"
      - name: Build the base benchmarks
        # Prefer the PR's benchmark program so both sides run the same
        # workload; fall back to the base's own copy if the PR's does not
        # compile against the base (e.g. it uses new APIs). Without either,
        # only the PR's results are reported.
        run: |
          if cp head/bench/perf.cr base/bench/perf.cr 2>/dev/null && crystal build --release base/bench/perf.cr -o "$RUNNER_TEMP/perf-base"; then
            echo "BASE_BINARY=$RUNNER_TEMP/perf-base" >> "$GITHUB_ENV"
          elif git -C base checkout -- bench/perf.cr 2>/dev/null && crystal build --release base/bench/perf.cr -o "$RUNNER_TEMP/perf-base"; then
            echo "BASE_BINARY=$RUNNER_TEMP/perf-base" >> "$GITHUB_ENV"
            echo "BASE_NOTE=The base was benchmarked with its own copy of bench/perf.cr." >> "$GITHUB_ENV"
          else
            echo "BASE_BINARY=-" >> "$GITHUB_ENV"
          fi

      - name: Run the benchmarks
        run: head/script/perf/run.sh "$BASE_BINARY" "$RUNNER_TEMP/perf-head" perf-results "$ROUNDS"
      - name: Compare
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 head/script/perf/compare.py perf-results \
            --base-label "$BASE_REF" --head-label "PR" \
            --title "Performance: \`${HEAD_SHA:0:7}\` vs \`$BASE_REF\` (\`${BASE_SHA:0:7}\`)" > perf-report.md
          if [ -n "${BASE_NOTE:-}" ]; then printf '\n%s\n' "$BASE_NOTE" >> perf-report.md; fi
          cat perf-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf-results
            perf-report.md

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        # Pull requests from forks get a read-only token; the report is still
        # in the job summary.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("perf-report.md", "utf8");
            const marker = "<!-- grpc-crystal-perf-report -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
