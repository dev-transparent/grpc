edition = "2023";

package torture.ed;

option features.field_presence = IMPLICIT;
option features.utf8_validation = NONE;

message M {
  int32 a = 1 [features.field_presence = EXPLICIT];
  int32 b = 2 [features.field_presence = IMPLICIT];
  repeated int32 c = 3 [features.repeated_field_encoding = EXPANDED];
  string d = 4;
  M e = 5 [features.message_encoding = DELIMITED];
  int32 req = 6 [features.field_presence = LEGACY_REQUIRED];
  reserved foo, bar;
}

enum Closed {
  option features.enum_type = CLOSED;
  CLOSED_ONE = 1;
}
